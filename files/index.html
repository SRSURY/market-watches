<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sergio</title>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;      /* centra la tarjeta */
      padding: 1rem;
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    .card {
      width: 100%;
      max-width: 400px;         /* en celular ocupa todo, en PC se limita */
      padding: 2rem;
      text-align: center;
      background: #1e293b;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }

    .card h1 { font-size: clamp(1.5rem, 5vw, 2rem); }
    .card p  { margin: .5rem 0 1.5rem; color: #94a3b8; }

    .socials {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;          /* si no caben, bajan de línea */
      gap: 1rem;
    }

    .socials a {
      font-size: 1.6rem;
      color: #e2e8f0;
      transition: transform .2s, color .2s;
    }
    .socials a:hover { transform: translateY(-3px); color: #38bdf8; }
  </style>
</head>
<body>
  <main class="card">
    <img src="IMG_6282.JPG" alt="Foto de Sergio" width="120" height="120" style="border-radius: 50%; margin-bottom: 1rem;">
    <h1>Sergio</h1>
    <p>Cacorro</p>

    <nav class="socials">
      <a href="https://x.com/tuusuario" aria-label="X" target="_blank" rel="noopener">
        <i class="fa-brands fa-tiktok"></i>
      </a>
      <a href="https://linkedin.com/in/tuusuario" aria-label="LinkedIn" target="_blank" rel="noopener">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://github.com/tuusuario" aria-label="GitHub" target="_blank" rel="noopener">
        <i class="fa-brands fa-whatsapp"></i>
      </a>
    </nav>
  </main>
</body>
</html>

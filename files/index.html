<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sergio</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
  --bg: #0E2A22;
  --card: #1B4D3E;
  --line: #2F7A66;
  --text: #F1F2F4;
  --muted: #C4C7CC;
  --accent: #C9A66B;
}

* { box-sizing: border-box; margin: 0; }

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 1rem;
  font-family: 'Montserrat', sans-serif;
  background: radial-gradient(circle at top, var(--card), var(--bg) 70%);
  color: var(--text);
}

.card {
  width: 100%;
  max-width: 400px;
  padding: 2rem;
  text-align: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.5);
}

.card h1 { font-size: clamp(1.5rem, 5vw, 2rem); letter-spacing: .05em; }
.card p  { margin: .5rem 0 1.5rem; color: var(--muted); }

.socials { display: flex; justify-content: center; flex-wrap: wrap; gap: 1rem; }

.socials a {
  font-size: 1.6rem;
  color: var(--text);
  transition: transform .2s, color .2s;
}
.socials a:hover { transform: translateY(-3px); color: var(--accent); }
  </style>
</head>
<body>
  <main class="card">
    <img src="IMG_6282.JPG" alt="Foto de Sergio" width="120" height="120" style="border-radius: 50%; margin-bottom: 1rem;">
    <h1>Sergio</h1>
    <p>Cacorro</p>

    <nav class="socials">
      <a href="https://www.tiktok.com/@marketwatchesper?_r=1" aria-label="TikTok" target="_blank" rel="noopener">
        <i class="fa-brands fa-tiktok"></i>
      </a>
      <a href="https://www.instagram.com/mktwatchespereira?srtk=YWQxdnAzaTNyMHFp" aria-label="Instagram" target="_blank" rel="noopener">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://www.facebook.com/profile.php?id=61587475773671&mibextid=wwXIfr&rdid=P2FTCkKApxlq97PZ&share_url=https%3A%2F%2Fwww.facebook.com%2Fshare%2F1C8BaweKAR%2F%3Fmibextid%3DwwXIfr#" aria-label="Facebook" target="_blank" rel="noopener">
        <i class="fa-brands fa-facebook"></i>
      </a>
      <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" aria-label="WhatsApp" target="_blank" rel="noopener">
        <i class="fa-brands fa-whatsapp"></i>
      </a>
      <a href="mailto:tucorreo@gmail.com" aria-label="Correo">
        <i class="fa-solid fa-envelope"></i>
      </a>
    </nav>
  </main>
</body>
</html>
